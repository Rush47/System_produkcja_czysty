<!doctype html><html lang="pl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>System produkcja czysty</title><style>body{font:16px system-ui;background:#101522;color:#f4f6fa;margin:0}main{max-width:900px;margin:auto;padding:24px}section{background:#1c2637;border-radius:16px;padding:20px;margin:16px 0}textarea{width:100%;box-sizing:border-box;min-height:110px;background:#0f1726;color:white;border:1px solid #50617a;border-radius:8px;padding:12px}button{padding:12px 24px;background:#4674de;color:white;border:0;border-radius:8px;cursor:pointer}button:disabled{opacity:.5}pre{white-space:pre-wrap;overflow-wrap:anywhere}small{color:#aabbd4}</style></head><body><main><h1>System produkcja czysty</h1><small id="status">Sprawdzanie serwera…</small><section><h2>Czat AI</h2><small id="model">Sprawdzanie modeli…</small><p><textarea id="prompt" placeholder="Wpisz wiadomość…"></textarea></p><button id="send">Wyślij</button><pre id="answer" aria-live="polite"></pre></section></main><script type="module">const $=id=>document.getElementById(id);async function check(){try{const [h,m]=await Promise.all([fetch('/api/health').then(r=>r.json()),fetch('/api/models').then(r=>r.json())]);$('status').textContent='Serwer: '+h.status;$('model').textContent='Podstawowy: '+m.primary.model+' | Awaryjny: '+m.fallback.model+(m.fallback.configured?' (skonfigurowany)':' (brak klucza)')}catch(e){$('status').textContent='Serwer niedostępny'}}$('send').onclick=async()=>{const message=$('prompt').value.trim();if(!message)return;$('send').disabled=true;$('answer').textContent='Oczekiwanie na odpowiedź…';try{const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message})});const d=await r.json();$('answer').textContent=r.ok?'['+d.provider+' / '+d.model+']\n'+d.text:'Błąd: '+d.error}catch(e){$('answer').textContent='Błąd połączenia: '+e.message}finally{$('send').disabled=false}};check();</script></body></html>
